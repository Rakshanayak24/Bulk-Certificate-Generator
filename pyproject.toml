[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bulk-certificate-generator"
version = "1.0.0"
description = "A bulk certificate generation API backed by SQLite and PDF files."
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110,<1", "uvicorn[standard]>=0.27,<1", "sqlalchemy>=2,<3", "reportlab>=4,<5", "email-validator>=2,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<9", "httpx>=0.27,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["certificate_api*"]
